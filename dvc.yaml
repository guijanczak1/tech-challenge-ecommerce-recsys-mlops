stages:
  prepare:
    cmd: python -m recsys.pipeline.prepare
    deps:
      - src/recsys/pipeline/prepare.py
      - src/recsys/data/loaders.py
      - src/recsys/data/synthetic.py
      - configs/params.yaml
    outs:
      - data/raw/events.csv

  preprocess:
    cmd: python -m recsys.pipeline.preprocess
    deps:
      - data/raw/events.csv
      - src/recsys/pipeline/preprocess.py
      - src/recsys/data/preprocessors.py
      - configs/params.yaml
    outs:
      - data/processed/interactions.parquet

  feature_eng:
    cmd: python -m recsys.pipeline.feature_eng
    deps:
      - data/processed/interactions.parquet
      - src/recsys/pipeline/feature_eng.py
      - configs/params.yaml
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet

  train:
    cmd: python -m recsys.pipeline.train
    deps:
      - data/processed/train.parquet
      - src/recsys/pipeline/train.py
      - src/recsys/models/baselines.py
      - src/recsys/models/factory.py
    outs:
      - models/baseline.joblib

  evaluate:
    cmd: python -m recsys.pipeline.evaluate
    deps:
      - models/baseline.joblib
      - data/processed/test.parquet
      - src/recsys/pipeline/evaluate.py
      - src/recsys/evaluation/metrics.py
    metrics:
      - metrics.json:
          cache: false
