[project]
name = "recsys"
version = "0.1.0"
description = "Sistema de recomendação de produtos de e-commerce (Tech Challenge Fase 02)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2,<3.0",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "dvc[s3]>=3.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.poetry]
packages = [{ include = "recsys", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.6.0"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# D203/D213 conflitam com a convenção Google; desligados por recomendação do ruff.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]          # docstrings não exigidas em testes
"scripts/**" = ["D"]       # tooling auxiliar (mantém módulo documentado, sem D por função)
"src/recsys/**/__init__.py" = ["D104"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 80
