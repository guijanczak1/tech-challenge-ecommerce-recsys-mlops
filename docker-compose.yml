# Serviços: servidor MLflow + execução do pipeline de treino.
# Uso: docker compose up --build
services:
  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-store:/mlflow

  train:
    build: .
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: >
      sh -c "python -m recsys.pipeline.prepare &&
             python -m recsys.pipeline.preprocess &&
             python -m recsys.pipeline.feature_eng &&
             python -m recsys.pipeline.train &&
             python -m recsys.pipeline.evaluate"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

volumes:
  mlflow-store:
